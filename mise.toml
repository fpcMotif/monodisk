[tools]
node = "26.10.0"
"github:oven-sh/bun" = { version = "canary", asset_pattern = "bun-darwin-aarch64.zip" }
mr-boxington = "1.17.0"
uv = "latest"

[tasks.install]
run = "bun install --frozen-lockfile"
[tasks.build]
run = "bun run build"
[tasks.check]
run = "bun run check"
[tasks.test-native]
run = "bun run test:native"
[tasks.test-terminal]
run = "uv run scripts/terminal_test.py"
[tasks.bench]
run = "bun run bench"
[tasks.run]
run = "./dist/monodisk"
